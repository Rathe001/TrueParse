# Runs the headless scoring test suite on every push and PR, so the badge
# actually vouches for the code and not just the packaging.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4

      - name: Syntax-check every addon file
        run: |
          set -e
          find . -name "*.lua" -not -path "./Libs/*" -print0 | xargs -0 -n1 luac5.4 -p

      - name: Run test suite
        run: lua5.4 tests/run.lua

      # validate.lua earns its place in CI: it caught anchorScore returning 42
      # for a spec fed its OWN crawled median, the day the six-spec tank
      # anchors landed (2026-07-30). It fuzzes randomised fights for invariant
      # violations and cross-checks role fairness, which run.lua's fixed
      # fixtures cannot. mock.lua scores the two hand-shaped /tp mock nights on
      # both clients - the breadth that catches one role or one client
      # silently breaking.
      - name: Validate scoring invariants
        run: lua5.4 tests/validate.lua

      - name: Score the mock nights
        run: lua5.4 tests/mock.lua

      # A syntax check proves a file PARSES; this proves it RUNS. Every file
      # in both TOCs is executed at file scope against stubbed WoW globals,
      # which is where a bad file-scope expression or a load-order dependency
      # actually bites - the red Lua error a user sees before the addon has
      # done anything at all.
      - name: Load every file the way a client does
        run: lua5.4 tests/load.lua
