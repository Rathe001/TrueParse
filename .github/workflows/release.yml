# Packages the addon and uploads to CurseForge (and GitHub Releases) on tag
# push. Requires repo secret CF_API_KEY (CurseForge API token) and the
# project id in .pkgmeta or the CurseForge project relation once created.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CurseForge's "What's New" shows the whole manual-changelog file, so
      # feed it ONLY the latest version's section (the top `## x.y.z` block),
      # not the full history. awk: print between the 1st and 2nd `## `.
      - name: Extract this release's changelog section
        run: awk '/^## /{c++} c==1' CHANGELOG.md > .release-notes.md

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
